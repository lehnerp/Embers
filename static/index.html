<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 3c2 6 9 9 9 17a9 9 0 0 1-18 0c0-5 3-7 4-11 1 3 2 4 4 5 0-4 0-7 1-11z' fill='%23f2994a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/embers.css">
<script>try { if (localStorage.getItem('embers-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c2 6 9 9 9 17a9 9 0 0 1-18 0c0-5 3-7 4-11 1 3 2 4 4 5 0-4 0-7 1-11z" fill="var(--accent)"/><path d="M16 17c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 2-5 .5 1 1 1.5 2 2 0-2 0-3 0-5z" fill="var(--bg)" opacity=".55"/></svg>
    Embers
  </div>
  <form id="searchForm" class="search" autocomplete="off">
    <div class="qwrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search the super-timeline: paths, commands, users, IPs   (-word excludes)" spellcheck="false" aria-label="Search the timeline">
      <kbd>/</kbd>
    </div>
    <button type="submit" class="btn primary">Search</button>
  </form>
  <div class="row" style="gap:12px;flex-wrap:nowrap">
    <div class="seg" role="group" aria-label="Time zone">
      <button type="button" data-tz="utc" aria-pressed="true" title="Show times in UTC">UTC</button>
      <button type="button" data-tz="host" aria-pressed="false" title="Show times in the host's time zone (current offset from the registry)">Host time</button>
    </div>
    <button class="chip-status" id="indexChip" title="Case status"><span class="dot"></span><span id="indexText">Loading</span></button>
  </div>
</header>

<div class="layout">
  <nav class="rail" aria-label="Sections">
    <button data-view="overview">Overview</button>
    <button data-view="impact">Impact<span class="count" id="cImpact"></span></button>
    <button data-view="timeline">Timeline</button>
    <button data-view="execution">Execution</button>
    <button data-view="persistence">Persistence<span class="count" id="cPersist"></span></button>
    <button data-view="registry">Registry<span class="count" id="cReg"></span></button>
    <button data-view="events">Event logs</button>
    <button data-view="logons">Logons &amp; RDP</button>
    <button data-view="fs">Filesystem</button>
    <button data-view="usn">USN journal</button>
    <button data-view="findings">Findings<span class="count" id="cFind"></span></button>
    <button data-view="artifacts">User artifacts</button>
    <button data-view="board">Evidence board<span class="count" id="cPins"></span></button>
    <div class="spacer"></div>
    <button data-view="case">Case &amp; source</button>
    <button id="themeBtn" type="button">Light theme</button>
  </nav>
  <main id="main">
    <section class="view" id="v-overview" hidden></section>
    <section class="view" id="v-impact" hidden></section>
    <section class="view" id="v-timeline" hidden></section>
    <section class="view" id="v-execution" hidden></section>
    <section class="view" id="v-persistence" hidden></section>
    <section class="view" id="v-registry" hidden></section>
    <section class="view" id="v-events" hidden></section>
    <section class="view" id="v-logons" hidden></section>
    <section class="view" id="v-fs" hidden></section>
    <section class="view" id="v-usn" hidden></section>
    <section class="view" id="v-findings" hidden></section>
    <section class="view" id="v-artifacts" hidden></section>
    <section class="view" id="v-board" hidden></section>
    <section class="view" id="v-case" hidden></section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="viewer drawer" id="drawer" hidden aria-label="Details">
  <div class="vhead">
    <div class="vtitle">
      <span class="path" id="dTitle"></span>
      <button class="btn small" id="dPin" title="Pin to the evidence board">Pin</button>
      <button class="btn small ghost" id="dClose" title="Close (Esc)">Close</button>
    </div>
    <div class="vmeta" id="dMeta"></div>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>
<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
